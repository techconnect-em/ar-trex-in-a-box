
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>T-Rex AR Experience</title>
    <!-- A-Frame 1.6.0 -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.3/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.3/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
     <div class="example-container">  
   <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind;
                  filterMinCF: 0.0001;
                filterBeta: 0.07;
                missTolerance: 5;
                warmupTolerance: 5;
                matrixInterpolation: true"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; preserveDrawingBuffer: true; antialias: true;
              toneMapping: ACESFilmic; exposure: 1.6;
           preserveDrawingBuffer: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
        <a-assets>
            <a-asset-item id="dinosaur-model" src="./assets/Running_T-Rex.glb"></a-asset-item>
        </a-assets>
        <!-- 強化されたライティング設定 -->
        <!-- 環境光 - 全体的な明るさ -->
        <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>

        <!-- メインの方向光 - 主要な影とハイライト -->
        <a-light type="directional" 
                color="#ffffff" 
                intensity="1" 
                position="2 4 -3" 
                target="#dinosaur">
        </a-light>

        <!-- 補助光 - 影の部分を明るく -->
        <a-light type="point" 
                color="#ffffff" 
                intensity="0.5" 
                position="-2 1 1">
        </a-light>
        <!-- 環境光2 - 下からの反射光 -->
        <a-light type="hemisphere" 
                color="#ffffff" 
                groundColor="#b4a87e" 
                intensity="0.5">
        </a-light>
        <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse; fuse: false;" raycaster="objects: #dinosaur;"></a-camera>
     <a-entity mindar-image-target="targetIndex: 0" ar-controller>
    <a-entity
        id="dinosaur"
        gltf-model="#dinosaur-model"
        animation-mixer="clip: idle; timeScale: 1.5; loop: repeat"
        position="-0.2 -0.5 -0.2"
        scale="0.25 0.25 0.25"
        rotation="0 45 0">
    </a-entity>
</a-entity>
    </a-scene>
  </div>
  
  <div id="scanning-overlay">箱の中をスキャンしてください</div>
  
  <div class="buttons">
        <button class="button" id="feed-button">
            <i class="fas fa-drumstick-bite"></i> 餌やり
        </button>
        <button class="button" id="release-button">外に出す</button>
        <button class="button" id="capture">
            <i class="fas fa-camera"></i>
        </button>
        <button class="button" id="show-card-button">
            <i class="fas fa-id-card"></i>
        </button>
        <button class="button" id="website-button">
            <i class="fas fa-globe"></i>
        </button>
    </div>
    
    <!-- T-Rex ステータス表示 -->
    <div id="trex-status" class="status-panel">
        <div class="status-item">
            <i class="fas fa-heart"></i>
            <span id="happiness-level">😊</span>
        </div>
        <div class="status-item">
            <i class="fas fa-drumstick-bite"></i>
            <span id="hunger-level">🍖</span>
        </div>
        <div class="status-item">
            餌やり回数: <span id="feed-count">0</span>
        </div>
    </div>
    

    <!-- カードコンテナ -->
    <div id="card-container" class="card-container hidden">
        <div class="trading-card">
            <div class="card-header">
                <h2 class="dino-name">ティラノサウルス・レックス</h2>
            </div>
            <div class="card-image">
                <img src="./assets/t-rex-card-image.jpg" alt="ティラノサウルス" class="card-image-real" />
            </div>
            <div class="card-body">
                <div class="dino-stats">
                    <div class="stat-item">
                        <span class="stat-label">HP</span>
                        <span class="stat-value">850</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">攻撃力</span>
                        <span class="stat-value">95</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">防御力</span>
                        <span class="stat-value">70</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">速　度</span>
                        <span class="stat-value">60</span>
                    </div>
                </div>
                <div class="dino-info">
                    <p><strong>学名:</strong> <i>Tyrannosaurus rex</i></p>
                    <p><strong>時代:</strong> 白亜紀後期 (約6,800万年前)</p>
                    <p><strong>生息地:</strong> 北アメリカ大陸西部</p>
                    <p><strong>サイズ:</strong> 体長 約12m / 体重 約8t</p>
                </div>
                <div class="dino-trivia">
                    <h3>豆知識</h3>
                    <p>ティラノサウルスの名前は「暴君とかげ」っていう意味なんだ。歯の長さは最大20cmもあって、とても強い顎で獲物の骨もバリバリと噛み砕いていたよ。目や鼻がとても良くて、遠くからでも獲物を見つけることができる優秀なハンターだったんだ。</p>
                </div>
            </div>
            <button id="close-card-button" class="close-button">×</button>
        </div>
    </div>
    
    <script src="script.js"></script>

</body>
</html>
